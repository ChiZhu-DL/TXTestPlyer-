<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>更多</title>
<style>
  :root { --bg:#111318; --card:#1a1d26; --line:#2d3442; --txt:#e5e7eb; --sub:#9ca3af; --accent:#f59e0b; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt); font-family:"Segoe UI","Microsoft YaHei",sans-serif; padding:16px 18px 30px; }
  h1 { font-size:18px; margin-bottom:12px; line-height:1.5; }
  #tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .tab { padding:7px 18px; border-radius:999px; border:1px solid var(--line); background:var(--card);
         font-size:13px; cursor:pointer; color:var(--txt); }
  .tab.on { background:var(--accent); border-color:var(--accent); color:#111; font-weight:700; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; align-items:start; }
  @media (max-width:640px) { #grid { grid-template-columns:repeat(2,1fr); gap:10px; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden;
          cursor:pointer; transition:box-shadow .15s; display:flex; flex-direction:column; }
  .card:hover { box-shadow:0 4px 14px rgba(0,0,0,.4); }
  .thumb { position:relative; background:#22262f; }
  .thumb img { width:100%; aspect-ratio:16/9; object-fit:cover; display:block; }
  .dur { position:absolute; right:6px; bottom:6px; background:rgba(0,0,0,.72); color:#fff;
         font-size:11px; padding:1px 6px; border-radius:4px; }
  .vip { position:absolute; left:6px; top:6px; background:#f59e0b; color:#fff; font-size:10px;
         padding:1px 6px; border-radius:4px; font-weight:700; }
  .coin { position:absolute; left:6px; top:6px; background:#0891b2; color:#fff; font-size:10px;
          padding:1px 6px; border-radius:4px; font-weight:700; }
  .info { padding:8px 10px 10px; flex:1; }
  .t { font-size:13px; line-height:1.45; height:2.9em; overflow:hidden; display:-webkit-box;
       -webkit-line-clamp:2; -webkit-box-orient:vertical; word-break:break-all; }
  .m { font-size:11px; color:var(--sub); margin-top:5px; display:flex; gap:10px; flex-wrap:wrap; }
  #hint, .empty { color:var(--sub); text-align:center; padding:40px 0; font-size:14px; }
  #moreBtn { display:block; margin:18px auto 0; padding:9px 26px; border-radius:8px;
             background:var(--card); color:var(--txt); border:1px solid var(--line); cursor:pointer; }
</style>
</head>
<body>
<h1 id="name">加载中…</h1>
<div id="tabs"></div>
<div id="hint">加载中…</div>
<div id="grid"></div>
<button id="moreBtn" onclick="loadMore()" style="display:none;">加载更多</button>

<script>
const $ = s => document.querySelector(s);
let MENUS = [], curTab = 0, curPage = 1, busy = false;

const esc = s => String(s || '').replace(/</g, '&lt;');

function cardHTML(it) {
  const img = it.img ? '/proxy/img?url=' + encodeURIComponent(it.img) : '';
  let badge = '';
  if (it.pay_type === 'vip') badge = '<span class="vip">VIP</span>';
  else if (it.pay_type === 'money') badge = `<span class="coin">${esc(it.money && it.money !== '-1' ? it.money + ' 金币' : '金币')}</span>`;
  return `
  <div class="card" onclick="window.open('/go?id=${it.id}','_blank')">
    <div class="thumb">
      ${img ? `<img src="${img}" loading="lazy" onerror="this.outerHTML='<div class=&quot;empty&quot; style=&quot;padding:0&quot;>加载失败</div>'">` : '<div class="empty">无封面</div>'}
      ${badge}
      ${it.duration ? `<span class="dur">${esc(it.duration)}</span>` : ''}
    </div>
    <div class="info">
      <div class="t">${esc(it.name) || '（无标题）'}</div>
      <div class="m"><span>${esc(it.click || 0)} 播放</span>${it.nickname ? `<span>${esc(it.nickname)}</span>` : ''}</div>
    </div>
  </div>`;
}

async function jfetch(url, opts) {
  const res = await fetch(url, opts);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

async function init() {
  const id = new URLSearchParams(location.search).get('id');
  if (!id) { $('#name').textContent = '缺少区块 id'; return; }
  try {
    const r = await jfetch('/api/blockDetail', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id })
    });
    if (!r.ok) { $('#name').textContent = '加载失败：' + (r.error || '') + ' ' + (r.msg || ''); return; }
    document.title = r.name || '更多';
    $('#name').textContent = '📄 ' + (r.name || '更多') + ' · 分类';
    MENUS = r.menus || [];
    if (!MENUS.length) { $('#hint').textContent = '该区块没有分类配置'; return; }
    $('#tabs').innerHTML = MENUS.map((m, i) =>
      `<span class="tab${i === 0 ? ' on' : ''}" onclick="pickTab(${i},this)">${esc(m.name)}</span>`).join('');
    loadList(1, true);
  } catch (e) { $('#name').textContent = '请求异常：' + e.message; }
}

function pickTab(i, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
  el.classList.add('on');
  curTab = i;
  loadList(1, true);
}

async function loadList(page, replace) {
  if (busy) return; busy = true;
  $('#moreBtn').style.display = 'none';
  if (replace) { $('#grid').innerHTML = ''; $('#hint').style.display = 'block'; $('#hint').textContent = '加载中…'; }
  try {
    const r = await jfetch('/api/more', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ filter: MENUS[curTab].filter, page })
    });
    if (!r.ok) { $('#hint').textContent = '加载失败：' + (r.error || '') + ' ' + (r.msg || ''); busy = false; return; }
    $('#hint').style.display = 'none';
    if (replace) $('#grid').innerHTML = '';
    if (r.items.length) $('#grid').insertAdjacentHTML('beforeend', r.items.map(cardHTML).join(''));
    else if (replace) $('#grid').innerHTML = '<div class="empty">该分类暂无内容</div>';
    if (r.items.length >= 10) $('#moreBtn').style.display = 'block';
  } catch (e) { $('#hint').textContent = '请求异常：' + e.message; }
  busy = false;
}

function loadMore() { curPage += 1; loadList(curPage, false); }

init();
</script>
</body>
</html>
